<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Portal</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="container">

    <div class="card">

        <div class="tabs">
            <button class="tab-btn active" id="registerTab">
                Register
            </button>

            <button class="tab-btn" id="loginTab">
                Login
            </button>
        </div>

        <!-- Registration Form -->

        <form id="registrationForm">

            <h2>Customer Registration</h2>

            <div class="form-group">
                <label>Customer Name</label>
                <input
                        type="text"
                        id="customerName"
                        maxlength="50"
                        required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                        type="email"
                        id="email"
                        required>
            </div>

            <div class="form-group mobile-group">
                <div>
                    <label>Country Code</label>

                    <select id="countryCode">
                        <option value="+91">+91</option>
                        <option value="+1">+1</option>
                        <option value="+44">+44</option>
                    </select>
                </div>

                <div>
                    <label>Mobile Number</label>

                    <input
                            type="tel"
                            id="mobile"
                            maxlength="10"
                            required>
                </div>
            </div>

           <div class="form-group">
    <label>
        Complete Mailing Address
        (Including ZIP/Postal Code)
    </label>

    <textarea
        id="address"
        rows="4"
        maxlength="200"
        placeholder="House No, Street, City, State, ZIP/Postal Code"
        required>
    </textarea>
</div>

            <div class="form-group">
                <label>Password</label>

                <input
                        type="password"
                        id="password"
                        maxlength="30"
                        required>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>

                <input
                        type="password"
                        id="confirmPassword"
                        maxlength="30"
                        required>
            </div>
<div class="form-group">
        <label>Role</label>
        <select id="loginRole">
            <option value="Customer">Customer</option>
            <option value="Officer">Officer</option>
        </select>
    </div>

  


            <div class="form-group">
                <label>
                    <input type="checkbox" id="notification">
                    Email Notifications
                </label>
            </div>

            <div class="btn-group">

                <button type="submit" class="btn-primary">
                    Register
                </button>

                <button type="reset" class="btn-secondary">
                    Reset
                </button>

            </div>

            <div id="message"></div>

        </form>

        <!-- Login Form -->
<!-- Login Form -->

<form id="loginForm" class="hidden">

    <h2>Customer Login</h2>

    <div class="form-group">
        <label>Customer ID</label>
        <input
            type="text"
            id="loginCustomerId"
            minlength="5"
            maxlength="20"
            placeholder="Enter Customer ID"
            required>
    </div>

    <div class="form-group">
        <label>Password</label>
        <input
            type="password"
            id="loginPassword"
            maxlength="30"
            placeholder="Enter Password"
            required>
    </div>

    <button type="submit" class="btn-primary">
        Login
    </button>

    <div id="loginMessage"></div>

</form>
        
        
        <div id="ackScreen" class="hidden">

    <h2 class="success">
        Customer Registration successful.
    </h2>

    <p id="customerInfo"></p>

</div>

    </div>

</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
